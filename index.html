<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留白教室 White Space</title>
  <meta name="description" content="留白教室 White Space｜留一點白，找到自己的空間。">
  <meta property="og:title" content="留白教室 White Space">
  <meta property="og:description" content="留一點白，找到自己的空間。">
  <meta property="og:image" content="assets/illust-pink.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#works">跳到內容</a>

  <!-- Banner -->
  <header class="banner" id="top">
    <div class="banner__bubbles" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <button class="about-btn" type="button" data-open-about aria-label="關於留白教室">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v6M12 7.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="banner__inner">
      <h1 class="banner__logo">
        <img src="assets/logo.webp" width="975" height="816" alt="留白教室 White Space">
      </h1>
      <p class="banner__tagline">留一點白，找到自己的空間</p>
    </div>
  </header>

  <main id="works">
    <nav class="filters" aria-label="分類">
      <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter" data-filter="課程" aria-pressed="false">課程</button>
      <button type="button" class="filter" data-filter="手記" aria-pressed="false">手記</button>
    </nav>

    <ul class="grid" id="grid" aria-live="polite"></ul>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> 留白教室 White Space</p>
  </footer>

  <button class="to-top" type="button" aria-label="回到頁首">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 彈出視窗 -->
  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal__scroll">
      <figure class="modal__hero">
        <img id="modal-hero" src="" alt="">
      </figure>

      <div class="modal__thumbs" id="modal-thumbs" role="group" aria-label="切換圖片"></div>

      <article class="modal__body">
        <p class="modal__tag" id="modal-tag"></p>
        <h2 class="modal__title" id="modal-title"></h2>
        <figure class="modal__figure" id="modal-figure">
          <img src="" alt="">
        </figure>
        <div class="modal__text" id="modal-text"></div>
      </article>
    </div>

    <div class="modal__actions">
      <button type="button" class="icon-btn" data-close aria-label="關閉">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--next" data-next aria-label="下一篇">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </dialog>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
